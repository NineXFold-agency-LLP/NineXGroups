# NineXGroups (ninexfold) — isolated from ninexhoomie production.
# Live app: /root/apps/ninexfold  |  PM2: ninexgroup-web  |  port 3012
# Does not modify ninexhoomie-production or staging vhosts.

upstream ninexgroup_web {
    server 127.0.0.1:3012;
}

server {
    listen 80;
    server_name ninexgroup.co.in www.ninexgroup.co.in;

    location / {
        proxy_pass http://ninexgroup_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }
}
